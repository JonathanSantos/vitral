# Limiares do quality gate (docs/TESTING.md). Única fonte dos números do gate.
# criterion: unit = só unitários; combined = unitários + integração + e2e; none = sem mínimo.
# Pacote abaixo da meta entra com o valor medido como mínimo e a meta ao lado. O mínimo só sobe.
module: github.com/JonathanSantos/vitral

coverage:
  # Pacotes puros: o mínimo vale só com unitários.
  internal/snapshot:        {criterion: unit, min: 85}
  internal/flow:            {criterion: unit, min: 85}
  internal/ux:              {criterion: unit, min: 85}
  internal/brand:           {criterion: unit, min: 85}
  internal/network:         {criterion: unit, min: 85}
  internal/security:        {criterion: unit, min: 85}
  internal/mock:            {criterion: unit, min: 85}
  internal/cli:             {criterion: unit, min: 85}
  internal/browser/install: {criterion: unit, min: 85}
  internal/cursor:          {criterion: unit, min: 85}

  # Demais pacotes sem browser.
  internal/config:     {criterion: unit, min: 70}
  internal/console:    {criterion: unit, min: 70}
  internal/ring:       {criterion: unit, min: 70}
  internal/screenshot: {criterion: unit, min: 70}

  # Pacotes que falam com o browser: cobertura combinada.
  internal/session: {criterion: combined, min: 70}
  internal/tools:   {criterion: combined, min: 70}
  internal/overlay: {criterion: combined, min: 70}
  internal/world:   {criterion: combined, min: 70}
  internal/app:     {criterion: combined, min: 70}
  internal/browser: {criterion: combined, min: 70}

  # Cola e ferramentas: cobertos por integração/e2e ou fora do binário.
  cmd/vitral:        {criterion: none}
  tools/brandgen:    {criterion: none}
  tools/qualitygate: {criterion: none}
  tools/cursorlab:   {criterion: none}
  tools/mcpbridge:   {criterion: none}

# Orçamento de tokens (estimativa ceil(len/4), test/tokens). Primeiro padrão que casar define o teto.
# Tetos = medição com ~20% de folga. Base em .quality/token-baseline.json (make tokens-baseline).
tokens:
  # Snapshot padrão (viewport) logo depois do open.
  - {match: "snapshot/form.html", max: 275}
  - {match: "snapshot/api.html", max: 70}
  - {match: "snapshot/styles.html", max: 60}
  - {match: "snapshot/dialog.html", max: 90}
  - {match: "snapshot/rerender.html", max: 50}
  - {match: "snapshot/large.html", max: 145}
  # Snapshot completo (full=true): a large.html estressa a compactação (500 linhas, menu de 120 itens).
  - {match: "snapshot-full/form.html", max: 285}
  - {match: "snapshot-full/api.html", max: 65}
  - {match: "snapshot-full/styles.html", max: 65}
  - {match: "snapshot-full/dialog.html", max: 90}
  - {match: "snapshot-full/rerender.html", max: 50}
  - {match: "snapshot-full/large.html", max: 290}
  # Respostas das ações dos cenários e2e.
  - {match: "action/*/*-open", max: 280}
  - {match: "action/*/*-snapshot", max: 480}
  - {match: "action/*/*-flow_run", max: 400}
  - {match: "action/*/*-wait_for", max: 330}
  - {match: "action/*/*-click", max: 280}
  - {match: "action/*/*", max: 170}

# Mutação (Gremlins). No PR, só os pacotes do escopo alterados em relação à base; no noturno, todos.
# Nota = mortos / (mortos + vivos); timeout, não coberto e inviável ficam fora da conta.
mutation:
  min: 75
  timeoutCoefficient: 20
  packages:
    - internal/snapshot
    - internal/mock
    - internal/flow
    - internal/ux
    - internal/brand
    - internal/cli
    - internal/network
    - internal/security
    - internal/browser/install
    - internal/cursor

<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Divs clicáveis - Fixture</title>
<style>.card { border: 1px solid #ccc; padding: 12px; margin: 8px; width: 220px; }</style></head>
<body>
  <!-- Divs clicáveis só por addEventListener: sem role, sem onclick, sem tabindex e sem cursor pointer. -->
  <h1>Planos</h1>
  <div class="card" id="basico">Plano Básico · R$ 19</div>
  <div class="card" id="pro">Plano Pro · R$ 49</div>
  <div class="card" id="time"><span>Plano Time</span> <span>· R$ 99</span></div>
  <p id="status" role="status">nenhum</p>
  <script>
    for (const id of ['basico', 'pro', 'time']) {
      document.getElementById(id).addEventListener('click', () => {
        document.getElementById('status').textContent = 'escolheu ' + id;
      });
    }
  </script>
</body>
</html>

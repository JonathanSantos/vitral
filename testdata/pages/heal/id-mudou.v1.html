<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Autocura: id mudou - Fixture</title></head>
<body>
  <!-- Autocura, caso "id mudou" (v1/v2): o id e o texto mudaram juntos numa refatoração. -->
  <main>
    <h1>Pedidos</h1>
    <section><h2>Filtros</h2>
      <button type="button" id="aplicar" onclick="say('aplicar')">Aplicar</button>
      <button type="button" id="limpar" onclick="say('limpar')">Limpar</button>
    </section>
  </main>
  <p id="status" role="status">nada</p>
  <button type="button" onclick="say('continuar')">Continuar</button>
  <script>
    function say(t) { const s = document.getElementById('status'); s.textContent = s.textContent === 'nada' ? t : s.textContent + ', ' + t; }
  </script>
</body>
</html>

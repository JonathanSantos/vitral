<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Autocura: sensível - Fixture</title></head>
<body>
  <!-- Autocura, caso "botão sensível renomeado" (v1/v2): pede confirmação. -->
  <main>
    <h1>Revisão</h1>
    <button type="button" onclick="say('voltar')">Voltar</button>
    <button type="button" onclick="say('confirmar')">Confirmar</button>
  </main>
  <p id="status" role="status">nada</p>
  <button type="button" onclick="say('continuar')">Continuar</button>
  <script>
    function say(t) { const s = document.getElementById('status'); s.textContent = s.textContent === 'nada' ? t : s.textContent + ', ' + t; }
  </script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Playground do cursor - Vitral</title>
  <!-- Alvos de vários tamanhos e posições para avaliar o cursor visual e gravar o GIF (make demo-cursor). -->
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f7f5f0; color: #1e1b2e; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 32px 48px; max-width: 1100px; }
    section { background: #fff; border: 1px solid #e3dfd6; border-radius: 12px; padding: 18px; }
    h1 { grid-column: 1 / -1; margin: 0; font-size: 26px; }
    h2 { margin: 0 0 12px; font-size: 16px; color: #5b5770; }
    button { font: 600 15px system-ui, sans-serif; border-radius: 8px; border: 1px solid #1e1b2e; background: #fff;
             padding: 10px 18px; cursor: pointer; }
    .big { width: 100%; padding: 26px; font-size: 20px; background: #3e63dd; color: #fff; border: 0; }
    .tiny { width: 16px; height: 16px; margin: 0 6px; }
    input[type=text] { font: 16px system-ui; padding: 10px; width: 100%; box-sizing: border-box; border: 1px solid #aaa; border-radius: 8px; }
    select { font: 16px system-ui; padding: 8px; }
    .card { position: relative; border: 1px solid #ccc; border-radius: 10px; padding: 16px; cursor: pointer; }
    .card .trash { position: absolute; top: 10px; right: 10px; padding: 4px 8px; }
    .split { display: inline-flex; border: 1px solid #1e1b2e; border-radius: 8px; overflow: hidden; cursor: pointer; }
    .split span { padding: 10px 16px; }
    .split button { border: 0; border-left: 1px solid #1e1b2e; border-radius: 0; padding: 10px 12px; }
    #status { grid-column: 1 / -1; font-weight: 600; }
    .bottom { grid-column: 1 / -1; margin-top: 900px; text-align: right; }
  </style>
</head>
<body>
  <main>
    <h1>Playground do cursor</h1>
    <p id="status" role="status">Pronto.</p>
    <section>
      <h2>Alvo grande</h2>
      <button class="big" onclick="say('Botão grande')">Continuar</button>
    </section>
    <section>
      <h2>Alvos pequenos</h2>
      <label><input class="tiny" type="checkbox" onclick="say('Termos')">Aceito os termos</label>
      <label><input class="tiny" type="checkbox" onclick="say('Novidades')">Quero novidades</label>
      <p>Leia a <a href="#politica" onclick="say('Política'); return false;">política de privacidade</a>.</p>
    </section>
    <section>
      <h2>Campos</h2>
      <p><input type="text" aria-label="Mensagem" placeholder="Escreva aqui"></p>
      <p><select aria-label="Cidade" onchange="say('Cidade: ' + this.value)"><option>Recife</option><option>Porto Alegre</option><option>Manaus</option></select></p>
    </section>
    <section>
      <h2>Card com ação dentro</h2>
      <div class="card" role="button" tabindex="0" aria-label="Pedido 1042" onclick="say('Abriu o pedido')">
        <strong>Pedido 1042</strong><br>2 itens · R$ 89,90
        <button class="trash" aria-label="Excluir pedido" onclick="event.stopPropagation(); say('Excluiu o pedido')">Excluir</button>
      </div>
      <p><span class="split" role="button" tabindex="0" aria-label="Salvar" onclick="say('Salvou')"><span>Salvar</span><button aria-label="Mais opções" onclick="event.stopPropagation(); say('Mais opções')">▾</button></span></p>
    </section>
    <section class="bottom">
      <button onclick="say('Chegou ao fim da página')">Voltar ao topo</button>
    </section>
  </main>
  <script>
    function say(text) { document.getElementById('status').textContent = text; }
  </script>
</body>
</html>

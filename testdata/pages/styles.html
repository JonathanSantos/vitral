<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Estilos - Fixture</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #ffffff; }
    .card { background: #f5f0e6; margin: 40px; padding: 24px; }
    .primary { color: #ffffff; background: #0055aa; border: 2px solid #003377; border-radius: 6px;
               font-size: 16px; font-weight: 700; padding: 10px 20px; cursor: pointer; }
    .hint { color: #555555; }
    .tall { height: 1800px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Painel</h1>
    <button class="primary" aria-describedby="dica">Salvar</button>
    <p class="hint" id="dica" role="status">Salva o rascunho</p>
  </div>
  <div class="tall"></div>
  <a href="#topo">Voltar ao topo</a>
</body>
</html>

# Release multiplataforma: goreleaser release --clean (requer uma tag git).
version: 2
project_name: vitral
builds:
  - main: ./cmd/vitral
    binary: vitral
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/JonathanSantos/vitral/internal/config.Version={{.Version}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - examples/**/*
checksum:
  name_template: checksums.txt
